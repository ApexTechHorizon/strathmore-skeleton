name: U-CS38 standalone service
on:
  push:
    branches: [U-CS38]
    paths: ['starters/spend-advisor/**', '.github/workflows/ucs38.yml']
  pull_request:
    paths: ['starters/spend-advisor/**', '.github/workflows/ucs38.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starters/spend-advisor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests -q
      - run: node --test tests/demo.test.cjs
      - run: docker build -t spend-advisor:ucs38 .
