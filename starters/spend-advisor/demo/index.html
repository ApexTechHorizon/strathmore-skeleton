<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>U-CS38 — spend-advisor demo</title>
  <style>
    body{font:16px/1.6 system-ui;max-width:760px;margin:32px auto;padding:0 18px;color:#18392d;background:#f8fcfa}
    label{display:block;margin-top:12px} input,button{font:inherit;padding:10px;box-sizing:border-box;max-width:100%}
    input{width:100%} button{background:#176744;color:white;border:0;border-radius:5px;margin:8px 8px 8px 0;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait} :focus-visible{outline:3px solid #9c5100;outline-offset:3px}
    article{padding:16px;margin:16px 0;border:1px solid #668b78;border-radius:8px;background:white}
    #status{min-height:2em} pre{white-space:pre-wrap;overflow-wrap:anywhere} .note{border-left:4px solid #176744;padding-left:12px}
  </style>
</head>
<body>
  <h1>spend-advisor · U-CS38</h1>
  <p class="note">Synthetic demonstration only. Up to three conditional planning suggestions, not forecasts or guaranteed savings.</p>
  <form id="request">
    <fieldset id="controls">
      <legend>Controlled staging operator demo</legend>
      <label for="key">Service key (kept only in this page's memory; never saved)</label>
      <input id="key" type="password" autocomplete="off" required>
      <label for="household">Synthetic household ID</label>
      <input id="household" value="demo-household" maxlength="128" required>
      <label for="month">Budget month</label>
      <input id="month" type="number" min="1" max="12" value="6" required>
      <label for="year">Budget year</label>
      <input id="year" type="number" min="2000" max="2100" value="2026" required>
      <button type="submit">Get suggestions</button>
    </fieldset>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="items" aria-label="Recommendations"></section>
  <h2>Acceptance accounting</h2>
  <p>Counts below are synthetic test decisions, not measured human adoption or money saved.</p>
  <pre id="metrics">No request yet.</pre>
  <script src="/demo/app.js" defer></script>
</body>
</html>
